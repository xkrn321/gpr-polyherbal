[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpr-polyherbal"
version = "1.0.0"
description = "Gaussian Process Regression prototype for mixture-formula data with synthetic examples"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "许库兰·阿不都许库尔"},
]
keywords = [
    "bayesian-optimization",
    "gaussian-process",
    "polyherbal",
    "uniform-design",
    "ethnopharmacology",
    "traditional-medicine",
]
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/xkrn321/gpr-polyherbal"
Repository = "https://github.com/xkrn321/gpr-polyherbal"

[tool.setuptools.packages.find]
where = ["src"]
